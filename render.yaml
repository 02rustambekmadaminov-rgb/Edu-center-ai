services:
  - type: web
    name: edusales-ai
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_SUPABASE_URL
        value: https://huhzwpojivdxaimnyfpy.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
